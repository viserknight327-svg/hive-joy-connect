workflows:
  hive-ios:
    name: Hive iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.hive.goodenergy"
      node: 22
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
        - tag
      tag_patterns:
        - pattern: "ios-v*"
          include: true
    scripts:
      - name: Install JavaScript dependencies
        script: npm ci
      - name: Build web app and sync iOS
        script: npm run build && npx cap sync ios
      - name: Build signed iOS archive
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \\
            --project "$XCODE_PROJECT" \\
            --scheme "$XCODE_SCHEME" \\
            --archive-flags="-allowProvisioningUpdates"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - "$CM_EMAIL"
        notify:
          success: true
          failure: true
